<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic leads – Hebelie</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./lib/legal.css">
<style>
.wrap{max-width:960px}
.panel{margin-top:32px;padding:24px;border:1px solid var(--line);background:var(--cream)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:400 .68rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--ink);background:var(--ink);color:var(--ivory);font:400 .68rem var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.embed-link{font-size:.82rem;color:var(--muted);margin-top:8px}
.embed-link code{font-size:.78rem}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="./">← Hebelie</a>
<h1>Clinic dashboard</h1>
<p class="meta" id="clinicLabel">Loading…</p>

<div class="toolbar">
<a class="btn ghost" href="./auth.html?as=professional">Account</a>
<button class="btn ghost" type="button" id="signOut">Sign out</button>
</div>

<div class="panel">
<p class="embed-link" id="embedHint" hidden>Embed link: <code id="embedUrl"></code></p>
<table>
<thead><tr><th>When</th><th>Name</th><th>Contact</th><th>Treatments</th></tr></thead>
<tbody id="leadRows"></tbody>
</table>
<p class="empty" id="noLeads" hidden>No leads yet. Share your embed link with patients.</p>
</div>
</main>
<script type="module" src="./lib/dashboard.js?v=13"></script>
</body>
</html>
